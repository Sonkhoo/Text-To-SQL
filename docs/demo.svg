<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Queryly chat interface preview</title>
  <desc id="description">A preview of the Queryly natural language database chat interface.</desc>
  <rect width="1200" height="700" rx="18" fill="#fbfcfa"/>
  <rect x="1" y="1" width="1198" height="698" rx="17" fill="none" stroke="#e4e9e5"/>
  <line x1="44" y1="82" x2="1156" y2="82" stroke="#e4e9e5"/>
  <g font-family="Arial, sans-serif" fill="#1d2925">
    <text x="78" y="54" font-size="24" font-weight="700">queryly</text>
    <text x="1000" y="54" font-size="14" fill="#7d8580">Database connected</text>
    <circle cx="980" cy="49" r="6" fill="#54ac80"/>
    <text x="600" y="170" text-anchor="middle" font-size="13" letter-spacing="3" fill="#2f725d">YOUR DATA, SIMPLIFIED</text>
    <text x="600" y="242" text-anchor="middle" font-size="58" font-weight="600">Ask your database</text>
    <text x="600" y="304" text-anchor="middle" font-size="58" font-style="italic" fill="#2f725d">anything.</text>
    <text x="600" y="350" text-anchor="middle" font-size="17" fill="#7d8580">Turn natural language into clear answers from your customer data.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#1d2925">
    <rect x="180" y="405" width="250" height="105" rx="10" fill="#fff" stroke="#e4e9e5"/>
    <text x="202" y="438">Show female customers</text>
    <text x="202" y="462">from Mumbai</text>
    <text x="397" y="485" font-size="23" fill="#2f725d">↗</text>
    <rect x="475" y="405" width="250" height="105" rx="10" fill="#fff" stroke="#e4e9e5"/>
    <text x="497" y="438">List every customer</text>
    <text x="497" y="462">in Delhi</text>
    <text x="692" y="485" font-size="23" fill="#2f725d">↗</text>
    <rect x="770" y="405" width="250" height="105" rx="10" fill="#fff" stroke="#e4e9e5"/>
    <text x="792" y="438">How many customers</text>
    <text x="792" y="462">are from Bengaluru?</text>
    <text x="987" y="485" font-size="23" fill="#2f725d">↗</text>
    <rect x="250" y="575" width="700" height="58" rx="11" fill="#fff" stroke="#cbd9d1"/>
    <text x="275" y="611" fill="#a4aca7">Ask a question about your customers...</text>
    <rect x="894" y="582" width="42" height="44" rx="8" fill="#224d40"/>
    <text x="915" y="613" text-anchor="middle" font-size="25" fill="#fff">→</text>
  </g>
</svg>
